# JuanLab: aggiorna il ramo `juanlab` da upstream (frzyc/genshin-optimizer) e pubblica il sito su GitHub Pages.
# - Solo a mano (Actions > "JuanLab - sync e Pages" > Run workflow): unisce upstream/master in `juanlab`, ricostruisce e pubblica.
# - A ogni push su `juanlab`: ricostruisce e pubblica.
# - Se l'unione fallisce non pubblica nulla: il sito resta all'ultima versione buona.
name: JuanLab - sync e Pages

on:
  workflow_dispatch:
  push:
    branches:
      - juanlab

# Permessi minimi; Pages e OIDC solo al job di deploy (il token OIDC non deve esistere durante la build)
permissions:
  contents: read

concurrency:
  group: juanlab-pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juanlab
          fetch-depth: 0
          filter: blob:none
          # Con il solo GITHUB_TOKEN il push fallisce quando upstream modifica i file in .github/workflows:
          # un secret SYNC_TOKEN (token personale con permesso "workflow") lo evita.
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Unisci upstream/master
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/frzyc/genshin-optimizer.git
          git fetch --filter=blob:none upstream master
          git merge --no-commit --no-ff upstream/master || true
          if ! git rev-parse -q --verify MERGE_HEAD > /dev/null; then
            echo "Nessuna novità da upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Il fork tiene solo Genshin Optimizer: via di nuovo Star Rail, Zenless, Somnia, il frontend sperimentale
          # e i workflow di upstream, anche quando upstream li ha modificati (cosi non diventano conflitti).
          DROP="apps/somnia apps/somnia-e2e apps/sr-frontend apps/zzz-frontend apps/gi-frontend libs/sr libs/zzz"
          git rm -r -q -f --ignore-unmatch $DROP
          git ls-files .github/workflows | grep -v '/juanlab-pages.yml$' | xargs -r git rm -q -f --ignore-unmatch
          # file del fork riscritti da noi (README, home, index.html): si tiene sempre la nostra versione
          git checkout HEAD -- README.md libs/gi/page-home/src/index.tsx apps/frontend/index.html && git add README.md libs/gi/page-home/src/index.tsx apps/frontend/index.html
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            git merge --abort || true
            echo "::error::Conflitto di merge con upstream/master: va risolto a mano."
            exit 1
          fi
          git commit --no-edit
          git push origin HEAD:juanlab
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Segnala il problema
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Sync da upstream non riuscito';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            if (open.data.some((i) => i.title === title)) return;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({ owner, repo, title, body: [
              `Il sync automatico è fallito: ${url}`,
              '',
              'Cause probabili:',
              '- conflitto tra upstream e le modifiche di JuanLab (va risolto a mano);',
              '- upstream ha modificato i workflow e manca il secret `SYNC_TOKEN` (in alternativa usa "Sync fork" e poi unisci `master` in `juanlab`).',
              '',
              'Il sito resta all\'ultima versione pubblicata.',
            ].join('\n') });

  build:
    needs: sync
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.sync.result == 'success' && (needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: juanlab
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Link e impostazioni dell'app
        # l'.env dell'originale ha valori segnaposto (quelli veri li mette la loro CI): qui i link giusti.
        # NX_GA_TRACKINGID resta il segnaposto: vuoto fa andare in errore ReactGA (Analytics e' gia in modalita test)
        run: |
          cat > apps/frontend/.env.local <<'ENV'
          NX_URL_GITHUB_GO=https://github.com/frzyc/genshin-optimizer
          NX_URL_GITHUB_FRZYC=https://github.com/frzyc
          NX_URL_GITHUB_LANTUA=https://github.com/lantua
          NX_URL_GITHUB_VAN=https://github.com/nguyentvan7
          NX_URL_WEBSITE_KQM=https://keqingmains.com/
          NX_URL_KQM_MULTI_GUIDE=https://keqingmains.com/misc/multi-optimization/
          NX_URL_GITHUB_API_GO_RELEASES=https://api.github.com/repos/frzyc/genshin-optimizer/releases/tags/
          ENV
          sed -i 's/^ *//' apps/frontend/.env.local
      - name: Build frontend
        run: |
          export NX_URL_GITHUB_GO_CURRENT_VERSION="https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)"
          yarn run nx run frontend:build:production
        env:
          NX_DAEMON: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/frontend

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
